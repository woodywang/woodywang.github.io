# Site settings
title: Brain Sandbox
description: >-
  一个关于技术与生活的思考实验场
baseurl: ""
url: "https://blog.brainsandbox.com"
lang: "zh-CN"
twitter_username: JinboWang14
github_username: woodywang
author:
  name: "Woody Wang"
  twitter: "JinboWang14"
  github: "woodywang"

# Build settings
markdown: kramdown
remote_theme: pages-themes/slate@v0.2.0
plugins:
  - jekyll-feed
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-polyglot

# Polyglot i18n
languages: ["zh-CN", "en"]
default_lang: "zh-CN"
exclude_from_localization: ["assets", "images", "css", "javascript", "favicon.svg", "CNAME", "robots.txt", "llms.txt", "docs"]
parallel_localization: false

sass:
  sourcemap: never

# Category and Tag display mappings (keyed by language)
category_display:
  zh-CN:
    tech: "技术分享"
    tech-sharing: "技术分享"
    life: "生活感悟"
    notes: "开发笔记"
    security: "信息安全"
    hardware: "硬件"
    blockchain: "区块链"
    ai-programming: "AI 编程"
  en:
    tech: "Tech"
    tech-sharing: "Tech Sharing"
    life: "Life"
    notes: "Dev Notes"
    security: "Security"
    hardware: "Hardware"
    blockchain: "Blockchain"
    ai-programming: "AI Programming"

tag_display:
  zh-CN:
    claude-code: "Claude Code"
    mcp: "MCP"
    ai-tools: "AI 工具"
    productivity: "开发效率"
  en:
    claude-code: "Claude Code"
    mcp: "MCP"
    ai-tools: "AI Tools"
    productivity: "Productivity"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - landing
  - CLAUDE.md
  - .claude
