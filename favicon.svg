<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Brain Sandbox Icon -->
  <rect width="100" height="100" rx="20" fill="#2e7d32"/>
  
  <!-- Brain shape -->
  <g transform="translate(50, 50)">
    <!-- Left hemisphere -->
    <path d="M-20,-15 Q-25,-20 -25,-10 Q-30,-5 -25,0 Q-30,5 -25,10 Q-25,20 -20,15 Q-15,20 -10,15 L-10,-15 Q-15,-20 -20,-15" 
          fill="white" opacity="0.9"/>
    
    <!-- Right hemisphere -->
    <path d="M20,-15 Q25,-20 25,-10 Q30,-5 25,0 Q30,5 25,10 Q25,20 20,15 Q15,20 10,15 L10,-15 Q15,-20 20,-15" 
          fill="white" opacity="0.9"/>
    
    <!-- Center connection -->
    <rect x="-10" y="-15" width="20" height="30" fill="white" opacity="0.9"/>
    
    <!-- Brain folds/gyri -->
    <path d="M-15,-10 Q-10,-8 -5,-10 M5,-10 Q10,-8 15,-10" 
          stroke="#2e7d32" stroke-width="1.5" fill="none"/>
    <path d="M-15,0 Q-10,2 -5,0 M5,0 Q10,2 15,0" 
          stroke="#2e7d32" stroke-width="1.5" fill="none"/>
    <path d="M-15,10 Q-10,8 -5,10 M5,10 Q10,8 15,10" 
          stroke="#2e7d32" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- Sandbox dots (representing sand) -->
  <circle cx="25" cy="75" r="2" fill="white" opacity="0.6"/>
  <circle cx="35" cy="78" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="30" cy="82" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="65" cy="76" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="70" cy="80" r="2" fill="white" opacity="0.6"/>
  <circle cx="75" cy="75" r="1.5" fill="white" opacity="0.5"/>
</svg>